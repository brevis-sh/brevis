<!doctype html>
<html lang="en" class="h-full">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Brevis</title>
    <link rel="icon" href="/assets/favicon.svg" type="image/svg+xml" />
    <!-- The same URL the stylesheet's @font-face names, so the preload is the file it uses. -->
    <link rel="preload" href="/assets/fonts/plex-sans-latin.woff2" as="font" type="font/woff2" crossorigin />
    <!--brevis:app-css-->
    <!-- The theme before the first paint, as the server's pages do (base.templ): the
         visitor's choice (or the system's) on <html>, so nothing flashes. -->
    <script>
      (function () {
        var d = document.documentElement, p = "auto";
        try { p = localStorage.getItem("brevis_theme") || "auto"; } catch (e) {}
        if (p !== "light" && p !== "dark") p = "auto";
        d.classList.add("js");
        d.dataset.themePref = p;
        try { d.dataset.navMode = localStorage.getItem("brevis_sidebar") === "short" ? "short" : "full"; } catch (e) { d.dataset.navMode = "full"; }
        d.dataset.theme = p === "auto" ? (matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark") : p;
      })();
    </script>
    <script type="module" crossorigin src="/app/assets/index-C_VFQsbw.js"></script>
    <link rel="modulepreload" crossorigin href="/app/assets/skeleton-V6DDmOgS.js">

    <link rel="modulepreload" crossorigin href="/app/assets/sparkline-CcjWYI0R.js">
    <link rel="stylesheet" crossorigin href="/app/assets/sparkline-ByJQ46Yo.css">
    <link rel="stylesheet" crossorigin href="/app/assets/index-2up5ntJE.css">
