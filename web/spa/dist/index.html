<!doctype html>
<html lang="en" class="h-full">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Brevis</title>
    <link rel="icon" href="/assets/favicon.svg" type="image/svg+xml" />
    <!-- The faces above the fold, preloaded at the EXACT URLs the server sheet's @font-face names (the ?v= is the
         file's content hash). Added by script because Vite rewrites a <link href="/assets/..."> to /app/assets/...,
         which is no file: the old preload here fetched nothing useful and warned. Without the preload the swap
         after the first paint rewraps text on a phone (measured 0.025 CLS at 390px; under 0.001 on a desktop).
         If a font file ever changes its hash changes and this only costs a duplicate fetch until updated; the
         server writing these where it writes the app.css link (spa.go) would remove the hard-coded hash. -->
    <script>
      ["plex-sans-latin.woff2?v=056e4e2459f5", "plex-mono-latin.woff2?v=c36f509c0a8f"].forEach(function (f) {
        var l = document.createElement("link");
        l.rel = "preload"; l.as = "font"; l.type = "font/woff2"; l.crossOrigin = "anonymous"; l.href = "/assets/fonts/" + f;
        document.head.appendChild(l);
      });
    </script>
    <!--brevis:app-css-->
    <!-- The theme before the first paint, as the server's pages do (base.templ): the
         visitor's choice (or the system's) on <html>, so nothing flashes. -->
    <script>
      (function () {
        var d = document.documentElement, p = "auto";
        try { p = localStorage.getItem("brevis_theme") || "auto"; } catch (e) {}
        if (p !== "light" && p !== "dark") p = "auto";
        d.classList.add("js");
        d.dataset.themePref = p;
        try { d.dataset.navMode = localStorage.getItem("brevis_sidebar") === "short" ? "short" : "full"; } catch (e) { d.dataset.navMode = "full"; }
        d.dataset.theme = p === "auto" ? (matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark") : p;
      })();
    </script>
    <script type="module" crossorigin src="/app/assets/index-DyATdZgB.js"></script>
    <link rel="modulepreload" crossorigin href="/app/assets/logo-CjfWMGgP.js">
    <link rel="modulepreload" crossorigin href="/app/assets/height-BvmkhO1X.js">
    <link rel="modulepreload" crossorigin href="/app/assets/icon-DIO0RrFT.js">
    <link rel="modulepreload" crossorigin href="/app/assets/sparkline-DJxHQ0KN.js">
    <link rel="modulepreload" crossorigin href="/app/assets/run-now-DjoBSoQY.js">
    <link rel="modulepreload" crossorigin href="/app/assets/useQuery-Dmyvznba.js">
    <link rel="stylesheet" crossorigin href="/app/assets/index-mdeYxCMW.css">
  </head>

  </body>
</html>
