# Development hot reload.
#
# The CSS is generated BEFORE `go build`, otherwise the binary embeds the old
# one. `full_bin` starts the API with the local environment's variables. The
# React app has its own development server (web/spa: `npm run dev`).
root = "."
tmp_dir = "tmp"

[build]
  pre_cmd = [
    "./bin/tailwindcss -i web/assets/app.src.css -o web/assets/app.css",
  ]
  cmd = "go build -o ./tmp/brevis ./cmd/brevis"
  bin = "./tmp/brevis"
  full_bin = "BREVIS_ENV=local BREVIS_LOG_LEVEL=debug ./tmp/brevis serve"

  include_ext = ["go", "css", "sql", "yaml"]

  exclude_regex = ["_test\\.go$"]
  exclude_dir  = ["tmp", "bin", "docs", ".git"]

  delay = 200
  stop_on_error = false
  send_interrupt = true
  kill_delay = 2000

[log]
  main_only = false
  time = true

[misc]
  clean_on_exit = true
